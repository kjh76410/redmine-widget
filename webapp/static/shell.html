<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="root">
    <div class="icon-btn" id="mainIcon" oncontextmenu="return false;">
        <div class="icon-glyph"></div>
    </div>
    <div id="toolbar">
        <div class="tool-btn" data-panel="my_issues" title="할당된 일감">
            <div class="glyph" style="-webkit-mask-image:url('assets/icons/my.png')"></div>
            <div class="badge" id="myIssuesBadge">0</div>
        </div>
        <div class="tool-btn" data-panel="favorites" title="즐겨찾기 프로젝트">
            <div class="glyph" style="-webkit-mask-image:url('assets/icons/bookmark.png')"></div>
        </div>
        <div class="tool-btn" data-panel="company_tree" title="전체 프로젝트">
            <div class="glyph" style="-webkit-mask-image:url('assets/icons/folder.png')"></div>
        </div>
        <div class="tool-btn" data-panel="team_tree" title="팀 레드마인">
            <div class="glyph" style="-webkit-mask-image:url('assets/icons/folder.png')"></div>
        </div>
        <div class="tool-btn" data-panel="resolved_by_version" title="버전별 연결된 일감">
            <div class="glyph" style="-webkit-mask-image:url('assets/icons/window.png')"></div>
        </div>
        <div class="tool-btn" data-panel="team_progress" title="팀별 진행상황">
            <div class="glyph" style="-webkit-mask-image:url('assets/icons/progress.png')"></div>
        </div>
    </div>
</div>
<script src="shell.js"></script>
</body>
</html>
