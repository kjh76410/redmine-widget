<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="user_id_dialog.css">
</head>
<body>
<div id="win">
    <div id="title">할당된 일감 - 로그인 아이디 설정</div>
    <div id="desc">
        보통은 API 키만으로 자동으로 알아내지만, 실패했거나 다른 사람의 일감을<br>
        보고 싶다면 레드마인 로그인 아이디(계정)를 직접 입력하세요.<br>
        (숫자로 된 사용자 ID를 알고 있다면 그것도 입력 가능합니다)
    </div>
    <input id="idInput" autocomplete="off">
    <div id="btnRow">
        <button class="dlg-btn" id="btnCancel">취소</button>
        <button class="dlg-btn" id="btnSave">저장</button>
    </div>
</div>
<script src="window_shape.js"></script>
<script src="user_id_dialog.js"></script>
</body>
</html>
