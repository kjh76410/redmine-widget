<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="calendar_panel.css">
</head>
<body>
<div id="win">
    <div id="cols">
        <div id="colUpcoming" class="col"></div>
        <div class="divider"></div>
        <div id="colCalendar">
            <div id="calHeader">
                <button class="nav" id="prevMonth" title="이전 달">&lsaquo;</button>
                <span id="monthLabel"></span>
                <button class="nav" id="nextMonth" title="다음 달">&rsaquo;</button>
                <button class="today-btn" id="todayBtn">오늘</button>
                <!-- 범례 자체를 달력 칸 칩과 같은 모양으로 둔다 - 글자가 곧 색 견본이라
                     따로 점을 찍어 설명할 게 없다(calendar_panel.css .legend .key). -->
                <span class="legend">
                    <span class="key planned">예정</span>
                    <span class="key today">오늘</span>
                    <span class="key late">지연</span>
                    <span class="key done">배포됨</span>
                </span>
                <span id="refreshBtn" title="새로고침"></span>
            </div>
            <div id="weekdays"></div>
            <div id="grid"></div>
        </div>
    </div>
</div>
<script src="calendar_panel.js"></script>
</body>
</html>
